<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stocker · Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20261008_v3" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="wordmark" href="/">stocker</a>
      <nav class="site-nav">
        <a href="/app">Predict</a>
        <a class="active" href="/rankings">Rankings</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">◐</button>
      </nav>
    </header>
    <main>
      <section class="page-intro">
        <p class="eyebrow">NSE stocks</p>
        <div class="section-title-row"><h1>Top picks</h1><div id="progress" class="mono" style="color:var(--muted);font-size:12px">Ready to scan.</div></div>
        <p>Stocks with the strongest possible movement over the next month.</p>
      </section>
      <section class="ranking-card section">
        <div class="progress-track"><i id="scanProgressBar"></i></div>
        <div class="ranking-head">
          <div class="ranking-tools" style="margin-top:0">
            <input id="rankingFilter" class="input filter-input" placeholder="Search ticker" aria-label="Filter stocks" />
            <label class="toggle"><input id="positiveOnly" type="checkbox" /> Positive only</label>
            <button id="startScan" class="btn-primary">Scan stocks</button>
          </div>
          <div id="status" class="status-line">No scan running.</div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>#</th><th>Ticker</th><th>1-month return</th><th>Next-day</th><th>Target</th><th>Price</th>
            </tr></thead>
            <tbody id="rankingRows"><tr><td colspan="6" class="empty">Start a scan to see the list.</td></tr></tbody>
          </table>
        </div>
        <details class="details">
          <summary>Stocks we could not check</summary>
          <div id="errors" class="details-content">None.</div>
        </details>
      </section>
    </main>
  </div>
  <script src="/static/rankings.js?v=20261008_v3"></script>
  <script src="/static/theme.js?v=20261008_v2"></script>
</body>
</html>
